<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALCALIX STUDIOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────
   VARIABLES
───────────────────────────────────────── */
:root {
  --red:        #e62429;
  --red-dim:    rgba(230,36,41,0.13);
  --red-glow:   rgba(230,36,41,0.28);
  --bg:         #070707;
  --bg2:        #0b0b0b;
  --card:       #0f0f0f;
  --card-h:     #151515;
  --line:       rgba(255,255,255,0.08);
  --line-m:     rgba(255,255,255,0.15);
  --t1:         #ebebeb;
  --t2:         rgba(235,235,235,0.55);
  --t3:         rgba(235,235,235,0.28);
  --fd:         'Oswald', sans-serif;
  --fb:         'DM Sans', sans-serif;
  --fm:         'DM Mono', monospace;
  --ease:       cubic-bezier(0.16,1,0.3,1);
  --dur:        0.52s;
}

/* ─────────────────────────────────────────
   RESET
───────────────────────────────────────── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;outline:none}
html{font-size:15px}
body{
  background:var(--bg);color:var(--t1);
  font-family:var(--fb);
  overflow:hidden;height:100vh;
  -webkit-font-smoothing:antialiased;
}
a{text-decoration:none;color:inherit}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit}

/* ─────────────────────────────────────────
   CANVAS
───────────────────────────────────────── */
#cvs{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.35}

/* ─────────────────────────────────────────
   INTRO
───────────────────────────────────────── */
#intro{
  position:fixed;inset:0;background:#000;z-index:9000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  transition:opacity 0.85s var(--ease);
}
#intro.out{opacity:0;pointer-events:none}
.il{
  font-family:var(--fd);font-size:clamp(2.2rem,6.5vw,4.8rem);
  font-weight:700;letter-spacing:0.14em;text-transform:uppercase;
  animation:iup 1s var(--ease) both;
}
.is{
  font-family:var(--fm);font-size:0.6rem;color:var(--red);
  letter-spacing:0.4em;text-transform:uppercase;
  animation:iup 1s 0.18s var(--ease) both;
}
.ib{width:0;height:1px;background:var(--red);margin-top:10px;animation:ibar 0.9s 0.36s var(--ease) both}
@keyframes iup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes ibar{from{width:0}to{width:clamp(100px,25vw,300px)}}

/* ─────────────────────────────────────────
   NAV
───────────────────────────────────────── */
nav{
  position:fixed;top:0;left:0;right:0;height:58px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 44px;z-index:200;
  background:rgba(7,7,7,0.92);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.nlogo{
  font-family:var(--fd);font-size:1.05rem;
  font-weight:700;letter-spacing:0.22em;text-transform:uppercase;
  display:flex;align-items:center;gap:10px;
}
.npip{
  width:6px;height:6px;border-radius:50%;
  background:var(--red);box-shadow:0 0 7px var(--red-glow);flex-shrink:0;
}
.nclock{font-family:var(--fm);font-size:0.62rem;color:var(--t3);letter-spacing:0.1em}

/* ─────────────────────────────────────────
   HOME
───────────────────────────────────────── */
#home{
  position:fixed;inset:0;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding-top:58px;
  transition:opacity 0.42s var(--ease),transform 0.42s var(--ease);
}
#home.hidden{opacity:0;pointer-events:none;transform:scale(0.975)}

.h-tag{
  font-family:var(--fm);font-size:0.6rem;color:var(--red);
  letter-spacing:0.38em;text-transform:uppercase;margin-bottom:18px;
  animation:fup 0.8s 0.1s var(--ease) both;
}
.h-title{
  font-family:var(--fd);
  font-size:clamp(2.3rem,5.2vw,4.4rem);
  font-weight:700;text-transform:uppercase;
  line-height:0.92;letter-spacing:-0.01em;text-align:center;
  margin-bottom:12px;
  animation:fup 0.8s 0.18s var(--ease) both;
}
.h-title em{font-style:normal;color:var(--red)}
.h-sub{
  font-size:0.82rem;color:var(--t2);
  text-align:center;max-width:340px;line-height:1.65;
  margin-bottom:44px;
  animation:fup 0.8s 0.26s var(--ease) both;
}
.h-nav{display:flex;gap:12px;animation:fup 0.8s 0.34s var(--ease) both}

/* Home buttons — clean cards, no emoji */
.hbtn{
  position:relative;width:188px;height:188px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  background:var(--card);border:1px solid var(--line-m);color:var(--t1);
  transition:background 0.3s var(--ease),border-color 0.3s var(--ease),
             transform 0.3s var(--ease),box-shadow 0.3s var(--ease);
  overflow:hidden;
}
.hbtn::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--red);transform:scaleX(0);transform-origin:left;
  transition:transform 0.32s var(--ease);
}
.hbtn:hover{
  background:var(--card-h);border-color:rgba(255,255,255,0.22);
  transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,0.55);
}
.hbtn:hover::before{transform:scaleX(1)}
.hbtn-n{
  position:absolute;top:12px;right:14px;
  font-family:var(--fm);font-size:0.56rem;color:var(--red);letter-spacing:0.1em;
}
/* Decorative SVG icon inside button */
.hbtn-icon{
  width:36px;height:36px;margin-bottom:14px;opacity:0.55;
  transition:opacity 0.28s,transform 0.28s var(--ease);
}
.hbtn:hover .hbtn-icon{opacity:0.9;transform:scale(1.08)}
.hbtn-label{
  font-family:var(--fd);font-size:0.92rem;font-weight:600;
  letter-spacing:0.2em;text-transform:uppercase;margin-bottom:5px;
}
.hbtn-sub{
  font-family:var(--fm);font-size:0.54rem;color:var(--t3);
  letter-spacing:0.12em;text-transform:uppercase;
}

@keyframes fup{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

/* ─────────────────────────────────────────
   LIST PANEL (Фильмы / Сериалы)
───────────────────────────────────────── */
.lpanel{
  position:fixed;inset:0;z-index:300;
  background:var(--bg2);
  display:flex;flex-direction:column;
  transform:translateY(100%);
  transition:transform var(--dur) var(--ease);
  overflow:hidden;
}
.lpanel.open{transform:translateY(0)}

.lbar{
  flex-shrink:0;height:58px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 44px;
  background:rgba(11,11,11,0.96);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.lbar-l{display:flex;align-items:center;gap:14px}
.lbar-title{
  font-family:var(--fd);font-size:0.95rem;font-weight:600;
  letter-spacing:0.22em;text-transform:uppercase;
}
.lbar-ct{
  font-family:var(--fm);font-size:0.56rem;color:var(--t3);
  letter-spacing:0.1em;padding:3px 8px;border:1px solid var(--line);
}
.lclose{
  display:flex;align-items:center;gap:7px;
  font-family:var(--fm);font-size:0.6rem;letter-spacing:0.15em;text-transform:uppercase;
  color:var(--t2);padding:7px 14px;border:1px solid var(--line);
  transition:color 0.22s,border-color 0.22s,background 0.22s;
}
.lclose:hover{color:#fff;border-color:var(--line-m);background:rgba(255,255,255,0.04)}
.lclose svg{transition:transform 0.26s var(--ease)}
.lclose:hover svg{transform:rotate(90deg)}

.lbody{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:36px 44px 60px;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.08) transparent;
}
.lbody::-webkit-scrollbar{width:3px}
.lbody::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:2px}

/* Section header inside list panel */
.lsec-head{
  display:flex;justify-content:space-between;align-items:flex-end;
  padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:20px;
}
.lsec-title{
  font-family:var(--fd);font-size:1.25rem;font-weight:600;
  text-transform:uppercase;letter-spacing:0.04em;
}
.lsec-label{font-family:var(--fm);font-size:0.55rem;color:var(--t3);letter-spacing:0.18em;text-transform:uppercase}

/* ─────────────────────────────────────────
   MOVIE CARDS (in list panel)
───────────────────────────────────────── */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}

.mcard{
  position:relative;height:280px;
  background:var(--card);border:1px solid var(--line);
  overflow:hidden;display:block;color:#fff;
  transition:border-color 0.3s,transform 0.3s var(--ease),box-shadow 0.3s;
  cursor:pointer;
}
.mcard:hover{border-color:var(--line-m);transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,0.55)}
.mc-bg{
  position:absolute;inset:0;background-size:cover;background-position:center;
  opacity:0.25;filter:grayscale(0.5);
  transition:opacity 1.1s var(--ease),transform 1.1s var(--ease),filter 1.1s var(--ease);
}
.mcard:hover .mc-bg{opacity:0.42;transform:scale(1.05);filter:grayscale(0.08)}
.mc-ov{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(7,7,7,1) 0%,rgba(7,7,7,0.08) 52%,transparent 100%);
}
.mc-ct{position:absolute;bottom:0;left:0;right:0;padding:24px 26px}

/* ─────────────────────────────────────────
   SERIES CARDS (in list panel)
───────────────────────────────────────── */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}

.scard{
  background:var(--card);border:1px solid var(--line);
  padding:24px 26px 26px;
  display:flex;flex-direction:column;justify-content:flex-end;
  min-height:200px;position:relative;overflow:hidden;color:inherit;
  transition:background 0.28s,border-color 0.28s,transform 0.3s var(--ease),box-shadow 0.3s;
  cursor:pointer;
}
.scard:hover{background:var(--card-h);border-color:var(--line-m);transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,0.5)}
.scard::after{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--red);transform:scaleX(0);transform-origin:left;
  transition:transform 0.32s var(--ease);
}
.scard:hover::after{transform:scaleX(1)}
.sc-num{
  position:absolute;top:18px;right:20px;
  font-family:var(--fd);font-size:2.4rem;font-weight:700;
  color:rgba(255,255,255,0.04);line-height:1;pointer-events:none;
  transition:color 0.3s;
}
.scard:hover .sc-num{color:rgba(230,36,41,0.05)}

/* shared card components */
.badge{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--fm);font-size:0.55rem;
  letter-spacing:0.2em;text-transform:uppercase;
  padding:3px 9px;margin-bottom:8px;
}
.badge.upcoming{border:1px solid var(--red);color:var(--red);background:var(--red-dim)}
.badge.released{border:1px solid var(--line-m);color:var(--t2)}
.bblink{width:4px;height:4px;border-radius:50%;background:var(--red);animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.25}}

.ctitle{
  font-family:var(--fd);font-size:1.35rem;font-weight:600;
  text-transform:uppercase;line-height:1;margin-bottom:5px;
}
.cep{
  font-family:var(--fm);font-size:0.56rem;color:var(--t2);
  letter-spacing:0.1em;text-transform:uppercase;margin-bottom:5px;
  transition:color 0.26s;
}
.scard:hover .cep{color:var(--red)}
.cdate{font-family:var(--fm);font-size:0.56rem;color:var(--t3);letter-spacing:0.1em;margin-bottom:10px}
.cdown{
  display:inline-block;font-family:var(--fd);font-size:0.9rem;
  font-weight:500;letter-spacing:0.08em;
  padding:4px 11px;border-left:2px solid var(--red);
  background:rgba(0,0,0,0.5);backdrop-filter:blur(5px);color:#fff;
}

/* ─────────────────────────────────────────
   DETAILS PANEL
───────────────────────────────────────── */
#detail{
  position:fixed;inset:0;z-index:500;
  display:flex;align-items:stretch;justify-content:flex-end;
  pointer-events:none;
}
#detail.open{pointer-events:auto}

/* backdrop */
#detail-bd{
  position:absolute;inset:0;background:rgba(0,0,0,0);
  transition:background 0.45s var(--ease);
}
#detail.open #detail-bd{background:rgba(0,0,0,0.65);backdrop-filter:blur(4px)}

/* drawer */
#detail-drawer{
  position:relative;z-index:1;
  width:min(540px,100vw);
  background:var(--bg2);
  border-left:1px solid var(--line);
  display:flex;flex-direction:column;
  transform:translateX(100%);
  transition:transform 0.5s var(--ease);
  overflow:hidden;
}
#detail.open #detail-drawer{transform:translateX(0)}

/* detail bar */
#detail-bar{
  flex-shrink:0;height:58px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 30px;
  background:rgba(11,11,11,0.96);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
#detail-type{
  font-family:var(--fm);font-size:0.58rem;color:var(--t3);
  letter-spacing:0.22em;text-transform:uppercase;
}
#detail-close{
  display:flex;align-items:center;gap:7px;
  font-family:var(--fm);font-size:0.6rem;letter-spacing:0.14em;text-transform:uppercase;
  color:var(--t2);padding:6px 13px;border:1px solid var(--line);
  transition:color 0.22s,border-color 0.22s,background 0.22s;
}
#detail-close:hover{color:#fff;border-color:var(--line-m);background:rgba(255,255,255,0.04)}
#detail-close svg{transition:transform 0.24s var(--ease)}
#detail-close:hover svg{transform:rotate(90deg)}

/* detail scroll body */
#detail-body{
  flex:1;overflow-y:auto;overflow-x:hidden;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.07) transparent;
}
#detail-body::-webkit-scrollbar{width:3px}
#detail-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.07);border-radius:2px}

/* detail hero image */
#d-hero{
  width:100%;height:220px;
  background-size:cover;background-position:center;
  position:relative;flex-shrink:0;
  filter:grayscale(0.3);
}
#d-hero::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to bottom,transparent 40%,var(--bg2) 100%);
}

/* detail content */
#d-content{padding:28px 30px 40px}

#d-badge-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
#d-title{
  font-family:var(--fd);font-size:clamp(1.5rem,3.5vw,2rem);
  font-weight:700;text-transform:uppercase;line-height:1;
  margin-bottom:6px;letter-spacing:0.01em;
}
#d-ep{
  font-family:var(--fm);font-size:0.6rem;color:var(--t2);
  letter-spacing:0.12em;text-transform:uppercase;margin-bottom:18px;
}
#d-countdown-wrap{
  display:inline-flex;align-items:center;gap:10px;
  padding:9px 16px;border:1px solid var(--line-m);
  margin-bottom:22px;background:rgba(0,0,0,0.35);
}
#d-countdown-label{
  font-family:var(--fm);font-size:0.54rem;color:var(--t3);
  letter-spacing:0.2em;text-transform:uppercase;
}
#d-countdown{
  font-family:var(--fd);font-size:1.05rem;font-weight:600;
  letter-spacing:0.06em;color:#fff;
}

/* meta grid */
#d-meta{
  display:grid;grid-template-columns:1fr 1fr;gap:1px;
  background:var(--line);margin-bottom:22px;
}
.d-meta-cell{
  background:var(--bg2);padding:14px 16px;
}
.d-meta-label{
  font-family:var(--fm);font-size:0.52rem;color:var(--t3);
  letter-spacing:0.18em;text-transform:uppercase;margin-bottom:5px;
}
.d-meta-val{
  font-family:var(--fd);font-size:0.85rem;font-weight:500;
  letter-spacing:0.04em;color:var(--t1);line-height:1.3;
}

/* cast */
#d-cast-label{
  font-family:var(--fm);font-size:0.54rem;color:var(--t3);
  letter-spacing:0.2em;text-transform:uppercase;margin-bottom:10px;
}
#d-cast{display:flex;flex-direction:column;gap:8px;margin-bottom:26px}
.cast-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 14px;border:1px solid var(--line);
  transition:border-color 0.22s,background 0.22s;
}
.cast-row:hover{border-color:var(--line-m);background:rgba(255,255,255,0.02)}
.cast-actor{font-size:0.82rem;font-weight:500;color:var(--t1)}
.cast-role{font-family:var(--fm);font-size:0.56rem;color:var(--t3);letter-spacing:0.08em}

/* action buttons */
#d-actions{display:flex;flex-direction:column;gap:10px}

.d-btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:14px 20px;
  font-family:var(--fd);font-size:0.82rem;
  font-weight:600;letter-spacing:0.18em;text-transform:uppercase;
  transition:background 0.26s,border-color 0.26s,color 0.26s,transform 0.26s var(--ease);
  text-decoration:none;
}
/* Watch button — primary */
.d-btn.watch{background:var(--red);color:#fff;border:1px solid var(--red)}
.d-btn.watch:hover{background:#ff2a2f;transform:translateX(3px)}
/* Behind scenes button */
.d-btn.behind{background:transparent;color:var(--t1);border:1px solid var(--line-m)}
.d-btn.behind:hover{border-color:rgba(255,255,255,0.3);background:rgba(255,255,255,0.04);transform:translateX(3px)}
/* Offline state — grey, non-clickable */
.d-btn.offline{
  background:transparent;color:var(--t3);border:1px solid var(--line);
  cursor:default;pointer-events:none;
}
.d-btn.offline .btn-offline-tag{
  font-family:var(--fm);font-size:0.48rem;letter-spacing:0.18em;
  color:var(--t3);border:1px solid var(--line);padding:2px 6px;
  text-transform:uppercase;
}

/* ─────────────────────────────────────────
   SCROLL REVEAL
───────────────────────────────────────── */
.rv{opacity:0;transform:translateY(14px);transition:opacity 0.52s var(--ease),transform 0.52s var(--ease)}
.rv.vis{opacity:1;transform:translateY(0)}

/* ─────────────────────────────────────────
   RESPONSIVE
───────────────────────────────────────── */
@media(max-width:768px){
  nav,.lbar,.lclose,#detail-bar{padding-left:20px;padding-right:20px}
  .lbody{padding:24px 20px 48px}
  .h-nav{flex-direction:column;gap:10px}
  .hbtn{width:88%;height:82px;flex-direction:row;gap:18px;padding:0 22px;justify-content:flex-start}
  .hbtn-icon{margin-bottom:0;width:28px;height:28px}
  .hbtn-sub{display:none}
  .mgrid,.sgrid{grid-template-columns:1fr}
  #detail-drawer{width:100vw;border-left:none}
}
</style>
</head>
<body>

<canvas id="cvs"></canvas>

<!-- INTRO -->
<div id="intro">
  <div class="ib"></div>
  <div class="il">ALCALIX</div>
  <div class="is">Studios &nbsp;·&nbsp; Official Universe</div>
</div>

<!-- NAV -->
<nav>
  <div class="nlogo"><span class="npip"></span>ALCALIX</div>
  <div class="nclock" id="nclock">--:--:--</div>
</nav>

<!-- HOME -->
<div id="home">
  <div class="h-tag">Вселенная Alcalix Studios</div>
  <h1 class="h-title">ВСЕЛЕННАЯ<br><em>БЕЗ</em> ГРАНИЦ</h1>
  <p class="h-sub">Официальная кинематографическая вселенная Alcalix Studios. Фильмы, сериалы и спешлы.</p>
  <div class="h-nav">

    <button class="hbtn" onclick="openList('movies')">
      <span class="hbtn-n" id="hmc"></span>
      <!-- Film icon -->
      <svg class="hbtn-icon" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="8" width="28" height="20" rx="1" stroke="currentColor" stroke-width="1.6"/>
        <line x1="4" y1="13" x2="32" y2="13" stroke="currentColor" stroke-width="1.2"/>
        <line x1="4" y1="23" x2="32" y2="23" stroke="currentColor" stroke-width="1.2"/>
        <line x1="10" y1="8" x2="10" y2="28" stroke="currentColor" stroke-width="1.2"/>
        <line x1="26" y1="8" x2="26" y2="28" stroke="currentColor" stroke-width="1.2"/>
      </svg>
      <span class="hbtn-label">Фильмы</span>
      <span class="hbtn-sub">Cinematic Releases</span>
    </button>

    <button class="hbtn" onclick="openList('series')">
      <span class="hbtn-n" id="hsc"></span>
      <!-- TV icon -->

<script>
/* ══════════════════════════════════════════════════
   ALCALIX STUDIOS — БАЗА ДАННЫХ
   ══════════════════════════════════════════════════

   ─── КАК ЗАПОЛНЯТЬ ───────────────────────────────

   ОБЩИЕ ПОЛЯ (фильмы и сериалы):
     title        — Название
     status       — "released" | "upcoming"
     premiereISO  — "2026-12-25T20:00:00"
                    upcoming → цель таймера
                    released → дата выхода
     bg           — URL обложки (или "" если нет)
     link         — ссылка на просмотр (или "" / "#")

   ДЕТАЛИ (открываются в боковой панели):
     genre        — жанр, напр. "Sci-Fi / Drama"
     duration     — длительность, напр. "1ч 54м" (фильмы) / "45 мин / эп." (серии)
     director     — режиссёр
     year         — год, напр. "2024"
     cast         — массив { actor, role }
       actor      — имя актёра
       role       — роль, напр. "Главный герой"

   КНОПКИ:
     btnWatch     — кнопка "СМОТРЕТЬ"
       show       — true | false   (скрыть/показать)
       online     — true | false   (true = работает, false = серая/offline)
       link       — ссылка (если online: true)

     btnBehind    — кнопка "ФИЛЬМ О ФИЛЬМЕ"
       show       — true | false
       online     — true | false
       link       — ссылка

   ТОЛЬКО ДЛЯ СЕРИАЛОВ:
     episode      — "Season 1 // Episode 8"

   ══════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════
   COUNTDOWN
   ══════════════════════════════════════════════════ */
function getCountdown(iso) {
  const diff = new Date(iso) - new Date();
  if (diff <= 0) return null;
  const s = Math.floor(diff / 1000);
  const d = Math.floor(s / 86400);
  const h = Math.floor((s % 86400) / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sc = s % 60;
  const p = n => String(n).padStart(2,'0');
  return d >= 1 ? `${d}Д ${p(h)}Ч ${p(m)}М ${p(sc)}С` : `${p(h)}Ч ${p(m)}М ${p(sc)}С`;
}

function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('ru-RU', {day:'numeric',month:'long',year:'numeric'});
}

/* ══════════════════════════════════════════════════
   RENDER MOVIE CARDS
   ══════════════════════════════════════════════════ */
function renderMovies() {
  const body = document.getElementById('lb-movies');
  body.innerHTML = `
    <div class="lsec-head">
      <span class="lsec-title">Cinematic Releases</span>
      <span class="lsec-label">${MOVIES.length} film${MOVIES.length!==1?'s':''}</span>
    </div>
    <div class="mgrid" id="mgrid"></div>`;

  const grid = document.getElementById('mgrid');
  MOVIES.forEach((m, i) => {
    const up = m.status === 'upcoming';
    const el = document.createElement('div');
    el.className = 'mcard rv';
    el.style.transitionDelay = `${i*0.06}s`;
    el.onclick = () => openDetail(m, 'film');
    const bg = m.bg ? `background-image:url('${m.bg}')` : 'background:#111';
    el.innerHTML = `
      <div class="mc-bg" style="${bg}"></div>
      <div class="mc-ov"></div>
      <div class="mc-ct">
        <div class="badge ${up?'upcoming':'released'}">${up?'<span class="bblink"></span>Ожидается':'Выпущен'}</div>
        <h3 class="ctitle">${m.title}</h3>
        <div class="cdate">${fmtDate(m.premiereISO)}</div>
        ${up?`<div class="cdown" data-cd="${m.premiereISO}">...</div>`:''}
      </div>`;
    grid.appendChild(el);
  });

  document.getElementById('lct-movies').textContent = `${MOVIES.length} Films`;
  document.getElementById('hmc').textContent = MOVIES.length;

/* ══════════════════════════════════════════════════

    el.style.transitionDelay = `${i*0.06}s`;
    el.onclick = () => openDetail(s, 'series');
    el.innerHTML = `
      <span class="sc-num">${String(i+1).padStart(2,'0')}</span>
      <div class="badge ${up?'upcoming':'released'}" style="margin-bottom:10px">${up?'<span class="bblink"></span>Ожидается':'Выпущен'}</div>
      <div class="cep">${s.episode||''}</div>
      <h4 class="ctitle">${s.title}</h4>

      ${up?`<div class="cdown" data-cd="${s.premiereISO}">...</div>`:''}`;
    grid.appendChild(el);

  document.getElementById('lct-series').textContent = `${SERIES.length} Series`;
  document.getElementById('hsc').textContent = SERIES.length;

/* ══════════════════════════════════════════════════
   DETAILS
   ══════════════════════════════════════════════════ */
let detailActiveISO = null;

function openDetail(item, type) {
  const up = item.status === 'upcoming';

  // header
  document.getElementById('detail-type').textContent = type === 'film' ? '— Фильм' : '— Сериал';

  // hero
  const hero = document.getElementById('d-hero');
  hero.style.display = item.bg ? 'block' : 'none';
  if (item.bg) hero.style.backgroundImage = `url('${item.bg}')`;

  // badge row
  const br = document.getElementById('d-badge-row');
  br.innerHTML = `<div class="badge ${up?'upcoming':'released'}">${up?'<span class="bblink"></span>Ожидается':'Выпущен'}</div>`;

  // title & episode
  document.getElementById('d-title').textContent = item.title;
  const epEl = document.getElementById('d-ep');
  epEl.textContent = item.episode || '';
  epEl.style.display = item.episode ? 'block' : 'none';

  // countdown
  const cdWrap = document.getElementById('d-countdown-wrap');
  if (up) {
    cdWrap.style.display = 'inline-flex';
    detailActiveISO = item.premiereISO;
    document.getElementById('d-countdown').textContent = getCountdown(item.premiereISO) || 'Скоро';
  } else {
    cdWrap.style.display = 'none';
    detailActiveISO = null;
  }

  // meta grid
  const meta = document.getElementById('d-meta');
  meta.innerHTML = `
    <div class="d-meta-cell"><div class="d-meta-label">Жанр</div><div class="d-meta-val">${item.genre||'—'}</div></div>
    <div class="d-meta-cell"><div class="d-meta-label">Длительность</div><div class="d-meta-val">${item.duration||'—'}</div></div>
    <div class="d-meta-cell"><div class="d-meta-label">Режиссёр</div><div class="d-meta-val">${item.director||'—'}</div></div>
    <div class="d-meta-cell"><div class="d-meta-label">Год</div><div class="d-meta-val">${item.year||'—'}</div></div>`;

  // cast
  const cast = document.getElementById('d-cast');
  cast.innerHTML = '';
  if (item.cast && item.cast.length) {
    document.getElementById('d-cast-label').style.display = 'block';
    item.cast.forEach(c => {
      const row = document.createElement('div');
      row.className = 'cast-row';
      row.innerHTML = `<span class="cast-actor">${c.actor}</span><span class="cast-role">${c.role}</span>`;
      cast.appendChild(row);
    });
  } else {
    document.getElementById('d-cast-label').style.display = 'none';
  }

  // action buttons
  const actions = document.getElementById('d-actions');
  actions.innerHTML = '';

  function makeBtn(cfg, labelText, icon) {
    if (!cfg || !cfg.show) return;
    const el = document.createElement(cfg.online ? 'a' : 'div');
    if (cfg.online && cfg.link) { el.href = cfg.link; el.target = '_blank'; }
    const offlineTag = !cfg.online ? '<span class="btn-offline-tag">Недоступно</span>' : '';
    el.className = `d-btn ${cfg.online ? (labelText==='СМОТРЕТЬ'?'watch':'behind') : 'offline'}`;
    el.innerHTML = `${icon} ${labelText} ${offlineTag}`;
    actions.appendChild(el);
  }

  makeBtn(item.btnWatch,
    'СМОТРЕТЬ',
    `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><polygon points="3,1 13,7 3,13" fill="currentColor"/></svg>`
  );
  makeBtn(item.btnBehind,
    'ФИЛЬМ О ФИЛЬМЕ',
    `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.3"/><line x1="7" y1="4" x2="7" y2="7.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="7" cy="9.5" r="0.7" fill="currentColor"/></svg>`
  );

  // scroll to top
  document.getElementById('detail-body').scrollTop = 0;

  // open
  document.getElementById('detail').classList.add('open');
}

function closeDetail() {
  document.getElementById('detail').classList.remove('open');
  detailActiveISO = null;
}

/* ══════════════════════════════════════════════════
   LIST PANEL OPEN / CLOSE
   ══════════════════════════════════════════════════ */
function openList(type) {
  document.getElementById('home').classList.add('hidden');
  const panel = document.getElementById(`lp-${type}`);
  panel.classList.add('open');
  setTimeout(() => {
    panel.querySelectorAll('.rv').forEach(el => {
      const r = el.getBoundingClientRect();
      if (r.top < window.innerHeight + 80) el.classList.add('vis');
    });
    panel.querySelector('.lbody').addEventListener('scroll', () => {
      panel.querySelectorAll('.rv:not(.vis)').forEach(el => {
        if (el.getBoundingClientRect().top < window.innerHeight + 60) el.classList.add('vis');
      });
    }, {passive:true});
  }, 220);
}

function closeList(type) {
  closeDetail();
  document.getElementById('home').classList.remove('hidden');
  const panel = document.getElementById(`lp-${type}`);
  panel.classList.remove('open');
  setTimeout(() => {
    panel.querySelector('.lbody').scrollTop = 0;
    panel.querySelectorAll('.rv').forEach(el => el.classList.remove('vis'));
  }, 560);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('detail').classList.contains('open')) { closeDetail(); return; }
    closeList('movies'); closeList('series');
  }
});

/* ══════════════════════════════════════════════════
   COUNTDOWN TICK
   ══════════════════════════════════════════════════ */
function tick() {
  document.querySelectorAll('[data-cd]').forEach(el => {
    const r = getCountdown(el.getAttribute('data-cd'));
    el.textContent = r ?? 'Вышел';
  });
  if (detailActiveISO) {
    const r = getCountdown(detailActiveISO);
    document.getElementById('d-countdown').textContent = r || 'Скоро';
  }
}

/* ══════════════════════════════════════════════════
   CANVAS PARTICLES
   ══════════════════════════════════════════════════ */
const cvs = document.getElementById('cvs');
const ctx = cvs.getContext('2d');
let pts = [];
function rcvs() { cvs.width = innerWidth; cvs.height = innerHeight; }
class P {
  constructor() { this.reset(); this.y = Math.random()*cvs.height; }
  reset() {
    this.x = Math.random()*cvs.width; this.y = cvs.height+4;
    this.r = Math.random()*0.85+0.18; this.vy = Math.random()*0.25+0.06;
    this.a = Math.random()*0.22+0.04;
  }
  tick() { this.y -= this.vy; if(this.y<-4) this.reset(); }
  draw() { ctx.fillStyle=`rgba(255,255,255,${this.a})`; ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill(); }
}
function anim() { ctx.clearRect(0,0,cvs.width,cvs.height); pts.forEach(p=>{p.tick();p.draw();}); requestAnimationFrame(anim); }

/* ══════════════════════════════════════════════════
   CLOCK
   ══════════════════════════════════════════════════ */
function clk() {
  document.getElementById('nclock').textContent =
    new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

/* ══════════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════════ */
window.addEventListener('load', () => {
  renderMovies(); renderSeries(); tick();
  rcvs(); window.addEventListener('resize', rcvs);
  for(let i=0;i<80;i++) pts.push(new P()); anim();
  clk(); setInterval(clk,1000); setInterval(tick,1000);

  setTimeout(() => {
    document.getElementById('intro').classList.add('out');
    setTimeout(() => { document.getElementById('intro').style.display='none'; }, 860);
  }, 2000);
});
</script>
